[project]
name = "saqr"
version = "0.1.0"
description = "Local visual geolocation. The server binds to 127.0.0.1."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "starlette==1.10.0",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "anthropic==2.3.0",
    "requests==2.34.2",
    "pillow==12.3.0",
    "pillow-heif==1.8.1",
    "numpy==2.5.2",
    "scipy==1.18.1",
    "opencv-python-headless==5.0.0.93",
    "huggingface-hub==2.3.0",
    "safetensors==0.8.0",
    "aiohttp==3.14.5",
    "protobuf==7.36.2",
    "pycryptodome==4.2.0",
    "pyequilib==0.6.0",
    "pyproj==3.8.0",
    "bd09convertor==0.0.3",
    "coordinatesconverter==0.1.5",
    # Not in requirements.txt: setup.sh installs these itself. streetlevel is --no-deps there.
    "torch==2.15.0",
    "torchvision==0.29.2",
    "streetlevel==0.12.13",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

# pyfrpc is Mapy.cz-only and does not build on Windows. setup.sh installs streetlevel with --no-deps.
[[tool.uv.dependency-metadata]]
name = "streetlevel"
version = "0.12.13"
requires-dist = [
    "aiohttp",
    "bd09convertor",
    "coordinatesconverter",
    "cython",
    "numpy",
    "pillow",
    "protobuf>4",
    "pycryptodome",
    "pyequilib",
    "pyexiv2",
    "pyproj",
    "pytest",
    "pytest-asyncio",
    "requests",
    "scipy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web/vendor"]

[tool.ruff.lint]
# Bugs only. Formatting the existing tree is not this change.
select = ["E9", "F"]
